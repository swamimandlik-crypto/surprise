<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Friendship Day 💖</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #ffd9e7;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
    color: #c93669;
}

#clickBtn {
    position: fixed;
    border: 0;
    border-radius: 999px;
    padding: 16px 34px;
    background: white;
    color: #e04b7d;
    font-size: 19px;
    font-weight: 700;
    box-shadow: 0 10px 25px rgba(190, 60, 105, 0.18);
    transition: left .25s ease, top .25s ease, transform .15s ease;
    touch-action: manipulation;
}

#clickBtn:active {
    transform: scale(.94);
}

#messageCard {
    display: none;
    width: 88%;
    max-width: 390px;
    padding: 34px 25px 28px;
    text-align: center;
    background: rgba(255, 255, 255, .82);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 28px;
    box-shadow: 0 18px 45px rgba(180, 58, 101, .20);
    animation: cardIn .65s cubic-bezier(.2,.8,.2,1);
}

#messageCard .emoji {
    font-size: 42px;
    margin-bottom: 12px;
}

#messageCard h1 {
    font-size: 26px;
    margin-bottom: 18px;
    color: #d83f72;
}

#messageCard p {
    font-size: 18px;
    line-height: 1.65;
    color: #8f3d5b;
}

#messageCard .closing {
    margin-top: 20px;
    font-size: 17px;
    font-weight: 700;
    color: #d83f72;
}

footer {
    position: fixed;
    bottom: 18px;
    width: 100%;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #c93669;
}

@keyframes cardIn {
    0% {
        opacity: 0;
        transform: scale(.75) translateY(20px);
    }
    70% {
        transform: scale(1.03);
    }
    100% {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.confetti {
    position: fixed;
    top: -15px;
    width: 9px;
    height: 14px;
    border-radius: 2px;
    pointer-events: none;
    animation: confettiFall 2.8s linear forwards;
}

@keyframes confettiFall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<button id="clickBtn">Click Here 💖</button>

<div id="messageCard">
    <div class="emoji">💖</div>
    <h1>Happy Friendship Day!</h1>

    <p>
        Friends make every ordinary day special.
        Thank you for being a part of my life,
        for the laughs, and smiles.
    </p>

    <div class="closing">Happy Friendship Day! 💖</div>
</div>

<footer>Made by Swami</footer>

<script>
const button = document.getElementById("clickBtn");
const card = document.getElementById("messageCard");

let clicks = 0;

function centerButton() {
    button.style.left = (window.innerWidth / 2 - button.offsetWidth / 2) + "px";
    button.style.top = (window.innerHeight / 2 - button.offsetHeight / 2) + "px";
}

function moveButton() {
    const margin = 18;
    const maxX = window.innerWidth - button.offsetWidth - margin;
    const maxY = window.innerHeight - button.offsetHeight - 70;

    const x = margin + Math.random() * Math.max(0, maxX - margin);
    const y = margin + Math.random() * Math.max(0, maxY - margin);

    button.style.left = x + "px";
    button.style.top = y + "px";
}

function showMessage() {
    button.style.display = "none";
    card.style.display = "block";
    createConfetti();
}

function createConfetti() {
    const pieces = ["#ff4f87", "#ff8fb3", "#ffd166", "#b8e1ff", "#cdb4db"];

    for (let i = 0; i < 90; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = pieces[Math.floor(Math.random() * pieces.length)];
        piece.style.animationDelay = Math.random() * .35 + "s";
        piece.style.animationDuration = (2 + Math.random() * 1.5) + "s";

        document.body.appendChild(piece);

        setTimeout(() => piece.remove(), 4000);
    }
}

button.addEventListener("click", () => {
    clicks++;

    if (clicks <= 3) {
        moveButton();

        if (clicks === 3) {
            button.textContent = "Catch Me! 😜";
        }
    } else {
        showMessage();
    }
});

window.addEventListener("resize", () => {
    if (clicks === 0) centerButton();
});

window.addEventListener("load", centerButton);
</script>

</body>
</html>
